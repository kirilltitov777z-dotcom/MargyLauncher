name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # запуск вручную во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Android SDK (автоматически принимает лицензии)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      # 3. Устанавливаем Gradle через SDKMAN (нет gradlew в репозитории)
      - name: Install Gradle
        run: |
          curl -s https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.5.0
          echo "$HOME/.sdkman/candidates/gradle/current/bin" >> $GITHUB_PATH

      # 4. Собираем debug APK
      - name: Build Debug APK
        run: gradle assembleDebug

      # 5. Загружаем собранный APK как артефакт (доступен 30 дней)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MargyLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
